<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi Sekolah</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
      padding: 20px;
    }
    .card {
      background: white; padding: 30px; border-radius: 16px;
      width: 100%; max-width: 400px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    h1 { text-align: center; color: #333; margin-bottom: 20px; font-size: 22px; }
    label { display: block; margin-bottom: 6px; font-size: 13px; color: #555; font-weight: 600; }
    input, select, textarea {
      width: 100%; padding: 10px; border: 2px solid #e0e0e0;
      border-radius: 8px; margin-bottom: 14px; font-size: 14px;
      transition: 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: #667eea;
    }
    button {
      width: 100%; padding: 12px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white; border: none; border-radius: 8px;
      font-size: 15px; font-weight: bold; cursor: pointer;
      transition: 0.2s;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(102,126,234,0.4); }
    button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .msg { margin-top: 14px; padding: 10px; border-radius: 8px; font-size: 13px; text-align: center; display: none; }
    .msg.success { background: #d4edda; color: #155724; display: block; }
    .msg.error { background: #f8d7da; color: #721c24; display: block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📋 Form Absensi</h1>
    <form id="formAbsen">
      <label>Nama Lengkap</label>
      <input type="text" id="nama" required placeholder="Contoh: Budi Santoso">

      <label>Kelas</label>
      <select id="kelas" required>
        <option value="">-- Pilih Kelas --</option>
        <option>X IPA 1</option><option>X IPA 2</option>
        <option>XI IPA 1</option><option>XI IPA 2</option>
        <option>XII IPA 1</option><option>XII IPA 2</option>
      </select>

      <label>Status</label>
      <select id="status" required>
        <option value="">-- Pilih Status --</option>
        <option>Hadir</option><option>Sakit</option>
        <option>Izin</option><option>Alfa</option>
      </select>

      <label>Keterangan (opsional)</label>
      <textarea id="keterangan" rows="2" placeholder="Contoh: demam"></textarea>

      <button type="submit" id="btnKirim">Kirim Absen</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('formAbsen');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('btnKirim');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = 'Mengirim...';
      msg.className = 'msg';

      const data = {
        nama: document.getElementById('nama').value,
        kelas: document.getElementById('kelas').value,
        status: document.getElementById('status').value,
        keterangan: document.getElementById('keterangan').value
      };

      try {
        const res = await fetch('/absen', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();

        if (result.success) {
          msg.textContent = '✅ ' + result.message;
          msg.className = 'msg success';
          form.reset();
        } else {
          msg.textContent = '❌ ' + result.message;
          msg.className = 'msg error';
        }
      } catch (err) {
        msg.textContent = '❌ Gagal terhubung ke server.';
        msg.className = 'msg error';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Kirim Absen';
      }
    });
  </script>
</body>
</html>
